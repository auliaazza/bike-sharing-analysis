[theme]
# Mengikuti base bawaan system (otomatis mendeteksi light/dark mode)
base = "system"

# Warna utama untuk widget aktif, tombol, fokus border, atau tab yang terpilih
primaryColor = "#87AECE"

# Warna latar belakang utama aplikasi (area konten utama)
backgroundColor = "#FFFFFF"

# Warna latar belakang untuk Sidebar (sesuai request kamu)
secondaryBackgroundColor = "#EDEDED"

# Warna teks utama aplikasi (menggunakan warna biru gelap dari palet agar kontras)
textColor = "#1D2A62"

# Jenis font yang bersih dan modern
font = "sans serif"

# Memberikan lengkungan (border radius) pada tombol dan input agar terlihat ramah/modern
radii = "0.5rem"
